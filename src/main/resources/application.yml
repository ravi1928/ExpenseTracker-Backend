server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: expense-tracker-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:/app/data/expensedb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASS:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-milliseconds: 86400000

logging:
  level:
    root: INFO
    com.expensetracker: DEBUG
